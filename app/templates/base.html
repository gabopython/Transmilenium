<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Transmilenium Logística y Transporte - Soluciones integrales en transporte y logística en Ecuador." />
  <title>{% block title %}Transmilenium Logística y Transporte{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
       
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
     
  <script src="{{ url_for('static', path='js/main.js') }}"></script>

  <!-- CSS Variables -->
  <style>
    :root {
      --brand-red: #CC0000;
      --brand-gold: #FFCC00;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background-color: var(--brand-red);
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .navbar-brand:hover, .nav-link:hover {
      color: var(--brand-gold) !important;
    }
    footer {
      background-color: #111;
      color: white;
      padding: 2rem 0;
    }
    footer a {
      color: var(--brand-gold);
      text-decoration: none;
    }
  </style>

  {% block head_extra %}{% endblock %}
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Transmilenium</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/services">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p class="mb-1">© {{ 2025 }} Transmilenium Logística y Transporte</p>
      <p class="mb-1">Tel: +593 99 999 9999 | Email: info@transmilenium.com.ec</p>
      <div class="social-icons mt-2">
        <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
